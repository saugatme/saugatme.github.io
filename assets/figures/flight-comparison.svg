<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img"><title>Arrival-delay rates in January 2024 and January 2025</title><rect width="760" height="250" fill="#f4f3fb"/><g font-family="Arial,sans-serif" fill="#302b4b"><text x="28" y="34" font-size="16" font-weight="bold">Arrival-delay rate: matched January periods</text><text x="28" y="58" font-size="12">Share of non-cancelled flights with a valid arrival result delayed at least 15 minutes</text><text x="28" y="114" font-size="13">January 2024</text><rect x="155" y="92" width="433.08" height="32" fill="#8d80b5"/><text x="598.0799999999999" y="114" font-size="14">24.06%</text><text x="28" y="176" font-size="13">January 2025</text><rect x="155" y="154" width="338.21999999999997" height="32" fill="#5544a3"/><text x="503.21999999999997" y="176" font-size="14">18.79%</text><text x="28" y="224" font-size="11">Source: project completion report · One month per year; not an annual comparison.</text></g></svg>